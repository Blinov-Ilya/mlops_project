apiVersion: 1

datasources:
  - name: Card Queue PostgreSQL
    uid: card-queue-postgres
    type: grafana-postgresql-datasource
    access: proxy
    url: postgres:5432
    user: grafana_reader
    secureJsonData:
      password: grafana
    jsonData:
      database: cardqueue
      sslmode: disable
      postgresVersion: 1600
